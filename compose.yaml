services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study_local
      POSTGRES_DB: study
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - study_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  study_data:
