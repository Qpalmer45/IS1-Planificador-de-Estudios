name: Comprobaciones
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: study_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U study -d study_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://study:ci_only@localhost:5432/study_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://study:ci_only@localhost:5432/study_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-navegador
          path: test-results/
          retention-days: 7
