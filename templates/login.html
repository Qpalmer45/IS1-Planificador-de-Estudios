<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión | IS1</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <header class="header">
      <span class="eyebrow">IS1 · Planificador de estudios</span>
      <h1>Iniciar sesión</h1>
      <p>Accede a tu cuenta y a tus tareas guardadas.</p>
    </header>

    <section class="panel">
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" required placeholder="estudiante@ucm.es" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="primary">Entrar</button>
      </form>
      <p id="feedback" class="feedback" role="status"></p>
      <p class="auth-switch">¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>.</p>
    </section>
  </main>

  <script>
    document.querySelector("#login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const feedback = document.querySelector("#feedback");
      feedback.textContent = "";

      const email = document.querySelector("#email").value;
      const password = document.querySelector("#password").value;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error);

        // Redirigir a la página principal tras iniciar sesión
        window.location.href = "/";
      } catch (err) {
        feedback.textContent = err.message;
      }
    });
  </script>
</body>
</html>
